os:
  edit: "nvim -- {{filename}}"
  editAtLine: "nvim +{{line}} -- {{filename}}"
  editAtLineAndWait: "nvim +{{line}} {{filename}}"
  open: "open {{filename}}"
gui:
  showIcons: true
  theme:
    selectedLineBgColor:
      - reverse
    selectedRangeBgColor:
      - reverse
  showFileTree: false
git:
  pagers:
    - externalDiffCommand: difft --syntax-highlight=off --background=light --display=inline
keybinding:
  universal:
    edit: "e"
